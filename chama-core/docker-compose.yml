services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: chama_postgres_v2
    environment:
      POSTGRES_USER: felixtwoli
      POSTGRES_PASSWORD: 'Twoli8451#'
      POSTGRES_DB: chama_db
    ports:
      - '5433:5432'
    volumes:
      - chama_postgres_data_v2:/var/lib/postgresql/data
    networks:
      - chama-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U felixtwoli -d chama_db']
      interval: 30s
      timeout: 10s
      retries: 3

  # NestJS Application
  chama-core:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: chama_core_app
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://felixtwoli:Twoli8451%23@postgres:5432/chama_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chama-network
    volumes:
      - ./logs:/app/logs # Mount logs directory if needed
    restart: unless-stopped

networks:
  chama-network:
    driver: bridge

volumes:
  chama_postgres_data_v2:
